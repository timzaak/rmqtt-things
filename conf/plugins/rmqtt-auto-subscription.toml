##--------------------------------------------------------------------
## rmqtt-auto-subscription
##--------------------------------------------------------------------

# See more keys and their definitions at https://github.com/rmqtt/rmqtt/blob/master/docs/en_US/auto-subscription.md

# Expressions can use ${clientid} to represent the client ID and ${username} to represent the client username.

subscribes = [
    #    { topic_filter = "x/+/#", qos = 1, no_local = false, retain_as_published = false, retain_handling = 0 },
    #    { topic_filter = "foo/${clientid}/#", qos = 1, no_local = false, retain_as_published = false, retain_handling = 0 },
    #    { topic_filter = "iot/${username}/#", qos = 1 }
    # Unified service wildcard (design §5.3): one rule covers every service_type
    # (property, action, future service types). Replaces the previous
    # property-only `thing/service/property/set` entry. The shadow reuses this
    # same rule (no separate entry needed).
    {topic_filter = "+/${clientid}/thing/service/+/set", qos = 2, no_local = true},
    {topic_filter = "+/${clientid}/thing/event/property/post_reply", qos = 2, no_local = true},
    # `file` is its own topic family (design §5.3), NOT under `event/`. The
    # previous `thing/event/file/upload_reply` filter never matched.
    {topic_filter = "+/${clientid}/thing/file/upload_reply", qos = 2, no_local = true},
    {topic_filter = "+/${clientid}/ota/upgrade", qos = 2, no_local = true},
    # 可能需要
    {topic_filter = "+/${clientid}/ota/version_reply" ,qos = 2, no_local = true},
]

